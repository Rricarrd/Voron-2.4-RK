# This file contains common pin mappings for the BIGTREETECH can0
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

#################################### EBB 36 USB ####################################
[mcu ebb]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1E000A001350425539383920-if00

[adxl345]
cs_pin: ebb: PB12
spi_software_sclk_pin: ebb: PB10
spi_software_mosi_pin: ebb: PB11
spi_software_miso_pin: ebb: PB2
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
probe_points:
    # Somewhere slightly above the middle of your print bed
    175,175, 30

[input_shaper]
shaper_type_y:mzv 
shaper_freq_y:36.200 
damping_ratio_y:0.100000

shaper_type_x:mzv 
shaper_freq_x:55.200 
damping_ratio_x:0.100000

[extruder]
## Extruder stepper
step_pin: ebb: PD0
dir_pin: ebb: PD1
enable_pin: !ebb: PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400 #set your nozzle diameter
filament_diameter: 1.750
max_extrude_only_distance: 101
max_extrude_only_velocity: 120
pressure_advance: 0.07 # calibrated 22/03/2026
pressure_advance_smooth_time: 0.03 #to be calibrated (good initial value)
max_extrude_cross_section: 5

## Heater
heater_pin: ebb: PB13

# PTC1000 thermistor
sensor_type: MAX31865
sensor_pin: ebb: PA4
spi_software_sclk_pin: ebb: PA5
spi_software_miso_pin: ebb: PA6
spi_software_mosi_pin: ebb: PA7
rtd_num_of_wires: 2
rtd_use_50Hz_filter: True
spi_speed: 4000000

control: pid
pid_Kp: 24.268 
pid_Ki: 1.973
pid_Kd: 74.625
min_temp: -20
max_temp: 360

## Pressure advance
# Try to keep pressure_advance below 1.0 - calibrate
pressure_advance: 0.07
pressure_advance_smooth_time: 0.030


[tmc2209 extruder]
uart_pin: ebb: PA15
interpolate: true
run_current: 0.65 #**
sense_resistor: 0.11 #**
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4


[fan]
max_power: 1
pin: ebb: PA0

[heater_fan hotend_fan]
pin: ebb: PA1
heater: extruder
heater_temp: 50.0

[neopixel hotend_rgb]
pin: ebb:PD3
chain_count: 3
initial_RED: 0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 1.0

