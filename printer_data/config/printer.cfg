# This file contains common pin mappings for the BigTreeTech OctoPus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths							[mcu] section
## Thermistor types						[extruder] and [heater_bed] sections - See 'sensor types' list at end of file
## Z Endstop Switch location			[safe_z_home] section
## Homing end position				    [gcode_macro G32] section
## Z Endstop Switch  offset for Z0		[stepper_z] section
## Probe points							[quad_gantry_level] section
## Min & Max gantry corner postions		[quad_gantry_level] section
## PID tune								[extruder] and [heater_bed] sections
## Probe pin							[probe] section
## Fine tune E steps					[extruder] section





[include mainsail.cfg]
[include macros.cfg]
[include timelapse.cfg]
[exclude_object]


##	[X in MOTOR0] - B Motor
##	[Y in MOTOR1] - A Motor
##	[E in MOTOR6] - Extruder
##	Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_2C001D000A5053424E363420-if00
restart_method: command
##--------------------------------------------------------------------

[include ebb_canbus.cfg]
[include btt_eddy_duo.cfg]
[include autotune.cfg]
[include homing.cfg]
[include screen.cfg]
[include orbiter2_smart_sensor.cfg]



[printer]
kinematics: corexy
max_velocity: 500
max_accel: 6000			
max_z_velocity: 17.5			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 150
square_corner_velocity: 15

[force_move]
enable_force_move: True

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on MOTOR0(B Motor)
[stepper_x]
# Movement settings
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40.0637  # calibrated with calibration bro (default 40)
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
# Sensorless homing
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 352
position_max: 352
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: ^PG6      # Set to MCU pin connected to TMC DIAG pin (same as endstop X)
interpolate: True
run_current: 1



## Y Stepper on MOTOR1 (A Motor)
[stepper_y]
# Movement settings
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40.0511 # calibrated with calibration bro (default 40)
microsteps: 16
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
# Sensorless homing
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: ^PG9      # Set to MCU pin connected to TMC DIAG pin
interpolate: True
run_current: 1


# Skew correction
#[skew_correction]
# SET_SKEW XY=140.5,141.2,99.8 XZ=141,141.2,99.5 YZ=141,141.2,99.8

#[skew_correction my_skew_profile]
#xy_skew = -0.004969898410101314
#xz_skew = -0.001417456290213884
#yz_skew = -0.0014174353664815093

#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left on MOTOR2_1
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: ^!ebb:PB6
position_endstop: -0.93
position_max: 330
position_min: -5
homing_speed: 10
second_homing_speed: 2
homing_retract_dist: 3



[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8


##	Z1 Stepper - Rear Left on MOTOR3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16 


[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8


##	Z2 Stepper - Rear Right on MOTOR4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16


[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8

##	Z3 Stepper - Front Right on MOTOR5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16


[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8



#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
##	SSR Pin - BED_OUT
heater_pin: PA3  # Alternative power using SSR relay and HE1 output.
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF3
max_power: 0.7
min_temp: 0
max_temp: 120
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

#####################################################################
# 	Fan Control
#####################################################################
[fan_generic Nevermore]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0

[heater_fan controller_fan]
##	Controller fan - CNC_FAN
pin: PD14
kick_start_time: 0.5
heater: heater_bed
heater_temp: 45.0
fan_speed: 0.5

[temperature_fan exhaust_fan]
pin: PD15
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
# Point this to your Eddy sensor
sensor_type: temperature_combined
sensor_list: temperature_probe btt_eddy 
combination_method: max
maximum_deviation: 999

# 'watermark' acts as an On/Off switch. 
# 'pid' would vary the fan speed smoothly.
control: watermark
max_delta: 1.0

# This is the "Safety" target. If Eddy > 60, fan turns ON.
target_temp: 0 
min_temp: 0
max_temp: 100

#####################################################################
#   Temperature sensors
#####################################################################
[temperature_sensor EBB36]
sensor_type: temperature_mcu
sensor_mcu: ebb
min_temp: -10
max_temp: 120

[temperature_sensor BTT-MCU]        
sensor_type: temperature_mcu
min_temp: -10
max_temp: 100

[temperature_sensor BTT-PI]
sensor_type: temperature_host
min_temp: -10
max_temp: 100

#####################################################################
# 	LED Control
#####################################################################

[output_pin caselight]
# Chamber Lighting - HE2 Connector
pin: PB10
pwm:true
shutdown_value: 0
value:0.2
cycle_time: 0.01

