#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################
[idle_timeout]
timeout: 1800

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL METHOD=rapid_scan
    G28
    G0 X175 Y175 Z30 F3600


[gcode_macro _CHOME]
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL_BASE
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    _QUAD_GANTRY_LEVEL_BASE METHOD=rapid_scan {rawparams}
    G28 Z  ; Re-home Z because QGL changes Z height

[gcode_macro _CQGL]
description: Conditional Quad Gantry Level
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        M117 Performing QGL...
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z  ; Re-home Z because QGL changes Z height
    {% else %}
        M117 QGL already applied.
        {action_respond_info("QGL already applied, skipping...")}
    {% endif %}

# Homing override
[homing_override]
axes: xyz
set_position_z: 0
gcode:
  # --- 1. Setup Parameters ---
  {% set HOME_CUR = 0.400 %}
  {% set driver_config_x = printer.configfile.settings['tmc2209 stepper_x'] %}
  {% set driver_config_y = printer.configfile.settings['tmc2209 stepper_y'] %}
  {% set RUN_CUR_X = driver_config_x.run_current %}
  {% set RUN_CUR_Y = driver_config_y.run_current %}
  
  {% set safe_x = 175 %} 
  {% set safe_y = 175 %}
  {% set z_hop = 8 %}

  # Check which axes you are trying to home
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # Initial safe Z hop
  G90
  G0 Z{z_hop} F600

  # --- 2. Home X ---
  {% if home_all or 'X' in params %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    G4 P2000
    G28 X0
    G91
    G1 X-25 F1200
    G90
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR_X}
  {% endif %}

  # --- 3. Home Y ---
  {% if home_all or 'Y' in params %}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    G4 P2000
    G28 Y0
    G91
    G1 Y-10 F1200
    G90
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR_Y}
  {% endif %}

  # --- 4. Home Z ---
  {% if home_all or 'Z' in params %}
    # Check if X and Y are either currently homed, or are being homed right now
    {% set x_is_homed = 'x' in printer.toolhead.homed_axes or home_all or 'X' in params %}
    {% set y_is_homed = 'y' in printer.toolhead.homed_axes or home_all or 'Y' in params %}

    {% if not x_is_homed or not y_is_homed %}
      { action_raise_error("You must home X and Y before you can safely home Z!") }
    {% else %}
      G0 X{safe_x} Y{safe_y} F6000
      G28 Z0
      G0 Z{z_hop} F600
    {% endif %}
  {% endif %}


[quad_gantry_level]
##	Gantry Corners for 350mm Build
gantry_corners:
	-60,-10
	410,420
#	Probe points
points:
	50,25
    50,275
	300,275
	300,25

speed: 300
horizontal_move_z: 1.5
retries: 5
retry_tolerance: 0.0125
max_adjust: 30

[bed_mesh]
horizontal_move_z: 2
speed: 200
# For the mesh dimensions below, the coordinates need to be reachable by the center of the probe. To calculate coordinates that will work, use the formula below:
# mesh x min = position_min_x + greater_of (15mm or x_offset) <--- in this term, only consider the x offset if it is positive, ignore if negative.
# mesh y min = position_min_y + greater_of (15mm or y_offset) <--- in this term, only consider the y offset if it is positive, ignore if negative.
# mesh x max = position_max_x - greater_of (15mm or |x_offset|) <--- in this term, only consider the x offset if it is negative, ignore if positive.
# mesh y max = position_max_y - greater_of (15mm or |y_offset|) <--- in this term, only consider the y offset if it is negative, ignore if positive.
# Example: Consider that you have a 300 x 300 bed with the max x and y positions being 300 and the min being 0. Your probe offsets are -20 for X and 10 for Y
# For mesh x min we ignore the x offset term because it is negative. Therefore mesh x min = 15
# For mesh y min we do not ignore the y offset term because it is positive but it is less than 15 so we use 15. Therefore mesh y min = 15
# For mesh x max we do not ignore the x offset term because it is negative. It is also greater than 15. Therefore mesh x max = 280
# For mesh y max we ignore the y offset term because it is positive but it is less than 15 so we use 15. Therefore mesh y max = 285
# The final result would be mesh_min: 15, 15 mesh_max: 280, 285
mesh_min: 20, 48  # modify these according to the above guide. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
mesh_max: 330, 302 # modify these according to the above guide. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
probe_count: 9, 9 
algorithm: bicubic
zero_reference_position: 175,175
split_delta_z: 0.01
bicubic_tension:0.2
#scan_overshoot: 8  #uncomment this section if you still have room left over on the X axis for some scan overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.
