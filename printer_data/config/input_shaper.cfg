[gcode_macro CALIBRATE_ALL_SHAPERS]
description: Home, Calibrate X and Y, and Save Results
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    M117 Calibrating X...
    SHAPER_CALIBRATE AXIS=X
    
    M117 Calibrating Y...
    SHAPER_CALIBRATE AXIS=Y
    
    M117 Calibration Complete!
    SAVE_CONFIG

    