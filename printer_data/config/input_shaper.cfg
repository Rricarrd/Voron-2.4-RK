[gcode_macro CALIBRATE_ALL_SHAPERS]
description: Home, Calibrate X and Y, and Save Results
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    M117 Calibrating X...
    SHAPER_CALIBRATE AXIS=X
    
    M117 Calibrating Y...
    SHAPER_CALIBRATE AXIS=Y
    
    M117 Calibration Complete!
    SAVE_CONFIG

[gcode_macro GENERATE_SHAPER_GRAPHS]
description: Calibrate and generate PNG graphs
gcode:
    G28
    TEST_RESONANCES AXIS=X
    TEST_RESONANCES AXIS=Y
    RUN_SHELL_COMMAND CMD=generate_shaper_graphs

[gcode_shell_command generate_shaper_graphs]
command: sh /home/rricarrd/klipper/scripts/calibrate_shaper.py /tmp/resonances_x_*.csv -o /home/rricarrd/printer_data/config/shaper_calibrate_x.png && /home/rricarrd/klipper/scripts/calibrate_shaper.py /tmp/resonances_y_*.csv -o /home/rricarrd/printer_data/config/shaper_calibrate_y.png
timeout: 60.
verbose: True